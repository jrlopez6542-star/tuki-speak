<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-dYyJrxhaqlvlMkrpm7EAx154KeQYOIOEssnmaKpws8U=' https://www.gstatic.com/firebasejs/12.19.0/ https://apis.google.com blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com https://www.google.com; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://tuki-speak.vercel.app https://*.googleapis.com wss://generativelanguage.googleapis.com https://*.firebaseapp.com https://www.gstatic.com https://apis.google.com https://www.google.com https://api.openai.com https://*.stt.speech.microsoft.com wss://*.stt.speech.microsoft.com https://*.tts.speech.microsoft.com wss://*.tts.speech.microsoft.com https://*.api.cognitive.microsoft.com https://*.cognitiveservices.azure.com wss://*.cognitiveservices.azure.com blob: data:; frame-src https://tuki-speak.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuki Speak – Pronunciación en inglés gratis</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="Mejora tu pronunciación y conversación en inglés gratis: sonidos difíciles, pares mínimos, shadowing y diálogos con puntaje.">
<meta name="theme-color" content="#1fa463">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuki Speak">
<meta name="app-version" content="2.43.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="./src/styles/app.css">
<style>
/* Pantalla de entrada (v2.41.0): fondo verde de marca a pantalla completa. Tuki es
   el SVG de la mascota con fondo transparente (sin el rect de icon.svg), asi que no
   hay ningun cuadro ni marco alrededor. Se retira desde main.js tras el primer
   render; si main.js falla, splash-failsafe la oculta a los ~8 s. */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#1fa463;color:#fff;text-align:center;padding:24px;transition:opacity .45s ease;animation:splash-failsafe .6s ease 8s forwards}
#splash.splash-done{opacity:0;visibility:hidden;pointer-events:none}
#splash .splash-tuki{width:min(38vw,160px);height:auto;animation:splash-in .5s ease both}
#splash .splash-title{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:.2px}
#splash .splash-sub{margin:0;font-size:15px;line-height:1.4;opacity:.92}
#splash .splash-dots{display:flex;gap:8px;justify-content:center;margin-top:4px}
#splash .splash-dots span{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.45;animation:splash-dot 1.2s ease-in-out infinite}
#splash .splash-dots span:nth-child(2){animation-delay:.18s}
#splash .splash-dots span:nth-child(3){animation-delay:.36s}
@keyframes splash-in{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes splash-dot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
@keyframes splash-failsafe{to{opacity:0;visibility:hidden;pointer-events:none}}
@media (prefers-reduced-motion:reduce){#splash{transition:none;animation:splash-failsafe .01s linear 8s forwards}#splash .splash-tuki,#splash .splash-dots span{animation:none}#splash .splash-dots span{opacity:.7}}
</style>
<script>
const APP_VERSION = '2.43.0'; // Backward compatibility for old SW
if (window.top !== window.self) { try { window.top.location = window.self.location; } catch (e) { document.documentElement.style.display = 'none'; } }
</script>
</head>
<body>
<div id="splash" role="status" aria-label="Cargando Tuki Speak">
  <svg class="splash-tuki" viewBox="0 0 512 512" aria-hidden="true"><g transform="translate(76 70) scale(3.4)"><ellipse cx="46" cy="58" rx="30" ry="34" fill="#1f2a33"/><ellipse cx="44" cy="66" rx="17" ry="20" fill="#fff4d6"/><circle cx="40" cy="40" r="11" fill="#fff"/><circle cx="42" cy="40" r="5.5" fill="#1f2a33"/><circle cx="44" cy="38" r="1.8" fill="#fff"/><path d="M50 34 C70 26 94 32 97 44 C92 52 72 54 52 50 Z" fill="#ff9f1c"/><path d="M52 46 C70 48 88 48 97 44 C92 54 70 58 52 50 Z" fill="#e5484d"/><circle cx="94" cy="42" r="3" fill="#1f2a33"/><path d="M30 90 l-4 8 M42 92 l0 8 M54 90 l4 8" stroke="#ff9f1c" stroke-width="4" stroke-linecap="round"/></g></svg>
  <p class="splash-title">Tuki Speak</p>
  <p class="splash-sub">Aprende ingl&eacute;s hablando con Tuki</p>
  <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
</div>
<div id="app">
  <header class="topbar">
    <div class="brand" id="brand" title="¡Toca a Tuki!"></div>
    <div class="stats">
      <button class="stat coins" id="stCoins" title="Monedas de Tuki (Tienda)">🪙 0</button>
      <button class="stat fire" id="stStreak" title="Racha"></button>
      <button class="stat xp" id="stXp" title="XP"></button>
      <button class="stat heart" id="stHearts" title="Vidas"></button>
      <button class="stat" id="stGear" title="Ajustes" aria-label="Ajustes">⚙️</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="learn"><span class="ic">🏠</span>Aprender</button>
    <button class="tab" data-tab="practice"><span class="ic">🎤</span>Práctica</button>
    <button class="tab" data-tab="progress"><span class="ic">📈</span>Progreso</button>
    <button class="tab" data-tab="words"><span class="ic">🃏</span>Palabras</button>
    <button class="tab" data-tab="chat"><span class="ic">💬</span>IA</button>
  </nav>
</div>
<div id="full" class="full hidden"><div class="full-inner" id="fullInner"></div></div>
<div id="modalRoot"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuki Speak – Pronunciación en inglés gratis</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="Mejora tu pronunciación y conversación en inglés gratis: sonidos difíciles, pares mínimos, shadowing y diálogos con puntaje.">
<meta name="theme-color" content="#1fa463">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuki Speak">
<meta name="app-version" content="2.12.0">
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" id="brand"></div>
    <div class="stats">
      <button class="stat fire" id="stStreak" title="Racha"></button>
      <button class="stat xp" id="stXp" title="XP"></button>
      <button class="stat heart" id="stHearts" title="Vidas"></button>
      <button class="stat" id="stUpdate" title="Buscar actualizaciones" aria-label="Actualizaciones">🔄</button>
      <button class="stat" id="stGear" title="Ajustes" aria-label="Ajustes">⚙️</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="learn"><span class="ic">🏠</span>Aprender</button>
    <button class="tab" data-tab="practice"><span class="ic">🎤</span>Práctica</button>
    <button class="tab" data-tab="progress"><span class="ic">📈</span>Progreso</button>
    <button class="tab" data-tab="words"><span class="ic">🃏</span>Palabras</button>
    <button class="tab" data-tab="chat"><span class="ic">💬</span>IA</button>
  </nav>
</div>
<div id="full" class="full hidden"><div class="full-inner" id="fullInner"></div></div>
<div id="modalRoot"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>

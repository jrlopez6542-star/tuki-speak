<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuki Speak – Pronunciación en inglés gratis</title>
<meta name="description" content="Mejora tu pronunciación y conversación en inglés gratis: sonidos difíciles, pares mínimos, shadowing y diálogos con puntaje.">
<meta name="theme-color" content="#1fa463">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuki Speak">
<style>
:root{
  --g:#1fa463; --g-d:#15814c; --g-l:#d9f5e6; --o:#ff9f1c; --o-d:#d9800a; --r:#ff4b4b; --r-d:#d13434; --r-l:#ffe1e1;
  --b:#1cb0f6; --b-d:#1591cc; --y:#ffd23f; --ink:#26323d; --mute:#7a8793; --line:#e3e8ec; --bg:#f7faf8; --card:#fff;
  --rad:16px; --sh:0 2px 0 var(--line);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:16px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.hidden{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:#fff;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--g-d);font-size:18px}
.brand svg{width:30px;height:30px}
.stats{display:flex;gap:6px}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;padding:6px 8px;border-radius:12px;background:none;border:0}
.stat:hover{background:#f1f4f6}
.stat.fire{color:var(--o)} .stat.xp{color:var(--b)} .stat.heart{color:var(--r)}
.stat.off{color:#b8c1c9;filter:grayscale(1)}
main{flex:1;padding:14px 14px 96px}
/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:20;display:flex;justify-content:space-around;background:#fff;border-top:2px solid var(--line);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;border:2px solid transparent;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--mute)}
.tab .ic{font-size:22px;line-height:1}
.tab.active{border-color:#bde9d2;background:var(--g-l);color:var(--g-d)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:900;letter-spacing:.3px;text-transform:uppercase;font-size:15px;transition:transform .05s,filter .1s;user-select:none}
.btn:active{transform:translateY(3px)}
.btn.primary{background:var(--g);color:#fff;box-shadow:0 4px 0 var(--g-d)}
.btn.primary:active{box-shadow:0 1px 0 var(--g-d)}
.btn.blue{background:var(--b);color:#fff;box-shadow:0 4px 0 var(--b-d)}
.btn.orange{background:var(--o);color:#fff;box-shadow:0 4px 0 var(--o-d)}
.btn.red{background:var(--r);color:#fff;box-shadow:0 4px 0 var(--r-d)}
.btn.ghost{background:#fff;color:var(--mute);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn[disabled]{background:#e5e9ec!important;color:#aab4bc!important;box-shadow:0 4px 0 #d4dade!important;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--rad);padding:16px;margin-bottom:14px}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
/* daily goal card */
.goal{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--o) calc(var(--p)*1%),#eef1f3 0);display:grid;place-items:center;flex:none}
.ring::after{content:attr(data-t);width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
/* course map */
.unit{margin:6px 0 26px}
.unit-head{border-radius:var(--rad);padding:16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.unit-head h3{margin:0 0 2px;font-size:19px}
.unit-head p{margin:0;opacity:.95;font-size:14px}
.unit-head .guide{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:12px;padding:8px 10px;font-weight:900;font-size:13px;white-space:nowrap}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 0 4px;position:relative}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:74px;height:70px;border-radius:50%;border:0;font-size:30px;display:grid;place-items:center;background:var(--uc,var(--g));color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.22);transition:transform .08s;position:relative}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.node.locked{background:#e5e9ec;color:#aab4bc;box-shadow:0 7px 0 #cfd6db}
.node.done{background:var(--y);box-shadow:0 7px 0 #d9ac10}
.node.current{animation:bob 1.6s ease-in-out infinite}
.node-label{margin-top:12px;font-weight:800;font-size:13px;color:var(--mute);max-width:150px;text-align:center}
.start-tip{position:absolute;top:-38px;background:#fff;border:2px solid var(--line);color:var(--g-d);font-weight:900;padding:5px 10px;border-radius:10px;font-size:13px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:2}
.start-tip::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ring-prog{position:absolute;inset:-9px;border-radius:50%;pointer-events:none}
/* popover / modal */
.overlay{position:fixed;inset:0;background:rgba(20,30,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease-out}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tipbox{background:#f3fbf7;border:2px solid #cdeedb;border-radius:14px;padding:12px 14px;margin:10px 0}
.tipbox b{color:var(--g-d)}
/* lesson */
.full{position:fixed;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column}
.full-inner{max-width:640px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.lhead{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
.xbtn{background:none;border:0;font-size:24px;color:#9aa6b0;padding:4px 6px;line-height:1}
.pbar{flex:1;height:16px;border-radius:10px;background:#e5e9ec;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--g);border-radius:10px;transition:width .35s;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08), inset 0 4px 0 rgba(255,255,255,.3)}
.lhearts{font-weight:900;color:var(--r);white-space:nowrap}
.lbody{flex:1;overflow:auto;padding:8px 18px 20px}
.ex-title{font-size:22px;font-weight:900;margin:8px 0 16px}
.badge-new{display:inline-block;background:#f3e8ff;color:#8b3fd9;font-weight:900;font-size:12px;border-radius:8px;padding:3px 8px;margin-bottom:6px;letter-spacing:.5px}
.prompt{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:19px;font-weight:700;background:#fff}
.mascot{width:74px;height:74px;flex:none}
.spk{width:44px;height:44px;border-radius:12px;border:0;background:var(--b);color:#fff;font-size:20px;box-shadow:0 4px 0 var(--b-d);flex:none;display:grid;place-items:center}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--b-d)}
.spk.big{width:96px;height:96px;border-radius:24px;font-size:42px}
.spk.slow{background:#fff;color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:17px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.opt .k{width:26px;height:26px;border:2px solid var(--line);border-radius:8px;font-size:13px;color:var(--mute);display:grid;place-items:center;flex:none}
.opt.sel{border-color:#84d8ff;background:#ddf4ff;color:#1480b3;box-shadow:0 3px 0 #84d8ff}
.opt.sel .k{border-color:#84d8ff;color:#1480b3}
.answer-line{min-height:112px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px 0;margin-bottom:22px;background:repeating-linear-gradient(transparent 0 54px,var(--line) 54px 56px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 13px;font-size:17px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.tile.used{background:#e5e9ec;color:transparent;box-shadow:none;border-color:#e5e9ec;pointer-events:none}
textarea.inp{width:100%;min-height:120px;border:2px solid var(--line);background:#f7f9fa;border-radius:14px;padding:12px;font-size:18px;resize:vertical}
textarea.inp:focus{outline:none;border-color:#84d8ff;background:#fff}
.listen-row{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:10px 0 24px}
.mic{width:100%;border:2px solid var(--line);border-radius:16px;background:#fff;padding:18px;font-weight:900;color:var(--b);font-size:17px;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:10px}
.mic.rec{background:#ffecec;border-color:#ffb3b3;color:var(--r);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,75,75,.15)}}
.heard{margin-top:14px;font-size:17px}
.heard .w-ok{color:var(--g-d);font-weight:800}.heard .w-bad{color:var(--r);text-decoration:underline wavy}
.score{font-weight:900;font-size:15px;margin-top:6px}
.notice{background:#fff7e6;border:2px solid #ffe0a3;border-radius:14px;padding:12px;margin:10px 0;font-size:15px}
.lfoot{border-top:2px solid var(--line);padding:16px 18px;padding-bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;transition:background .15s}
.lfoot .btn{min-width:150px}
.lfoot.ok{background:#d7ffb8;border-top-color:#d7ffb8}
.lfoot.bad{background:var(--r-l);border-top-color:var(--r-l)}
.fb{flex:1 1 260px;min-width:0}
.fb h3{font-size:21px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.lfoot.ok .fb h3{color:#3f8f06} .lfoot.bad .fb h3{color:#c62828}
.fb .ans{font-weight:800;margin:2px 0 4px}
.lfoot.ok .fb{color:#3f8f06} .lfoot.bad .fb{color:#c62828}
.fb .exp{font-size:14px;color:#44505b;margin-top:4px}
.lfoot.ok .btn.primary{background:#58a700;box-shadow:0 4px 0 #3f7b00}
.lfoot.bad .btn.primary{background:var(--r);box-shadow:0 4px 0 var(--r-d)}
/* complete */
.complete{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;overflow:auto}
.complete h1{color:var(--o);font-size:30px}
.scards{display:flex;gap:10px;margin:14px 0;width:100%;max-width:420px}
.scard{flex:1;border:2px solid;border-radius:14px;overflow:hidden}
.scard .t{color:#fff;font-weight:900;font-size:12px;padding:4px;text-transform:uppercase}
.scard .v{font-weight:900;font-size:20px;padding:10px 4px;background:#fff}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* vocab */
.chips{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;color:var(--mute)}
.chip.active{border-color:var(--g);color:var(--g-d);background:var(--g-l)}
.search{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff}
.wlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.witem{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.witem .spk{width:38px;height:38px;font-size:16px}
.witem .en{font-weight:800}
.witem .es{color:var(--mute);font-size:14px}
.lvl{display:flex;gap:3px;margin-left:auto;flex:none}
.lvl i{width:6px;height:18px;border-radius:3px;background:#e5e9ec}
.lvl i.on{background:var(--g)}
.flash{perspective:1000px;margin:10px auto 18px;max-width:420px;width:100%}
.flash-in{position:relative;height:260px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;gap:12px}
.face.back{transform:rotateY(180deg);background:#f3fbf7;border-color:#cdeedb;box-shadow:0 5px 0 #cdeedb}
.face .big{font-size:28px;font-weight:900}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate .btn{min-width:0!important;flex-direction:column;padding:10px 4px;font-size:12px;gap:2px}
.rate .btn small{font-size:11px;opacity:.9;text-transform:none;font-weight:700}
/* chat */
.chatlog{display:flex;flex-direction:column;gap:10px;min-height:240px;max-height:52vh;overflow:auto;padding:4px 2px 10px}
.msg{max-width:85%;padding:10px 13px;border-radius:16px;font-size:16px;line-height:1.35;white-space:pre-wrap}
.msg.bot{background:#fff;border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--b);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.fix{background:#fff7e6;border:2px solid #ffe0a3;align-self:flex-start;font-size:14px}
.msg.err{background:var(--r-l);color:#b71c1c;align-self:center;font-size:14px}
.msg .mini{background:none;border:0;font-size:16px;padding:0 0 0 6px;vertical-align:middle}
.chatbar{display:flex;gap:8px;align-items:flex-end}
.chatbar textarea{flex:1;min-height:48px;max-height:120px;border:2px solid var(--line);border-radius:14px;padding:11px;resize:none}
.iconbtn{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:20px;flex:none;box-shadow:0 3px 0 var(--line)}
.iconbtn.rec{background:#ffecec;border-color:#ffb3b3;animation:pulse 1s infinite}
/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid #f0f3f5}
.set-row:last-child{border-bottom:0}
.set-row label{font-weight:800}
.set-row .desc{font-size:13px;color:var(--mute);font-weight:600}
.field{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
select.field{appearance:auto}
input[type=range]{width:160px;accent-color:var(--g)}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#dfe5e9;border-radius:30px;transition:.2s}
.switch span::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--g)}
.switch input:checked+span::before{transform:translateX(22px)}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:900;background:#eef1f3;color:var(--mute)}
.pill.ok{background:var(--g-l);color:var(--g-d)}
.empty{text-align:center;padding:26px 10px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#26323d;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:90;animation:fade .2s;max-width:90%;text-align:center}
a{color:var(--b-d)}
.ipa{font-family:"Doulos SIL","Charis SIL","Gentium Plus","Segoe UI",sans-serif;color:#8b3fd9;font-weight:800}
.wd{cursor:pointer;border-radius:6px;padding:1px 3px;display:inline-block}
.wd:hover{background:#eef6ff}
.wd.g{color:#1c8a4a;background:#e3f8ec}.wd.y{color:#a86b00;background:#fff3d6}.wd.r{color:#c62828;background:#ffe3e3}
.target{font-size:24px;font-weight:800;line-height:1.6;margin:6px 0 4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .opt{justify-content:center;font-size:22px;padding:22px 10px;flex-direction:column;gap:4px}
.scorebig{font-size:40px;font-weight:900}
.cmp{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.dlg{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.dlg .msg{max-width:90%}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:118px 1fr 44px;gap:8px;align-items:center;font-size:14px;font-weight:800}
.bar .tr{height:14px;background:#eef1f3;border-radius:8px;overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--mute);font-weight:800;text-transform:uppercase}
.pcard{display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;width:100%}
.pcard .em{font-size:34px;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" id="brand"></div>
    <div class="stats">
      <button class="stat fire" id="stStreak" title="Racha"></button>
      <button class="stat xp" id="stXp" title="XP"></button>
      <button class="stat heart" id="stHearts" title="Vidas"></button>
      <button class="stat" id="stGear" title="Ajustes" aria-label="Ajustes">⚙️</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="learn"><span class="ic">🏠</span>Aprender</button>
    <button class="tab" data-tab="practice"><span class="ic">🎤</span>Práctica</button>
    <button class="tab" data-tab="progress"><span class="ic">📈</span>Progreso</button>
    <button class="tab" data-tab="words"><span class="ic">🃏</span>Palabras</button>
    <button class="tab" data-tab="chat"><span class="ic">💬</span>IA</button>
  </nav>
</div>
<div id="full" class="full hidden"><div class="full-inner" id="fullInner"></div></div>
<div id="modalRoot"></div>
<script>
/* =================== CONTENIDO DEL CURSO =================== */
// Lecciones de pronunciación: expl = explicación, mouth = posición de boca/lengua,
// ex = palabras ejemplo [en, es], pairs = pares mínimos [palabraSonidoA, palabraSonidoB] (a = sonido objetivo/lado A),
// pairLabels = etiqueta de cada lado, quiz = preguntas de oído, sents = frases [en, es]
const COURSE = [
{ id:'u1', title:'Vocales que cambian el significado', icon:'🅰️', color:'#1fa463',

  else { card.int = card.reps === 0 ? (q === 3 ? 1 : q === 5 ? 3 : 1) : card.reps === 1 ? (q === 3 ? 3 : 6) : Math.round(card.int * card.ef * (q === 3 ? 0.8 : q === 5 ? 1.3 : 1)); card.reps++; card.due = Date.now() + card.int * DAY; }
  card.ef = Math.max(1.3, card.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
  save();
}

function buildLesson(l, mode = 'lesson') {
  const ex = [];

    const bIdx = l.lines.map((x, i) => x[0] === 'B' ? i : -1).filter(i => i >= 0);
    const aLines = l.lines.filter(x => x[0] === 'A').slice(1).sort((a, b) => a[1].length - b[1].length);
    const bLines = l.lines.filter(x => x[0] === 'B').slice().sort((a, b) => a[1].length - b[1].length);
    bIdx.forEach((i, k) => {
      ex.push({ kind: 'dialog', l, i });
      if (k === 1) ex.push({ kind: 'ltype', l, text: aLines[0][1], es: aLines[0][2] });
      if (k === 2) ex.push({ kind: 'order', l, text: bLines[0][1], es: bLines[0][2], pool: l.lines.map(x => x[1]) });
    });
    const sh = pick(aLines.slice(0, 3));
    ex.push({ kind: 'shadow', l, text: sh[1], es: sh[2] });
    return ex;
  }
  const P = l.pairs ? shuffle(l.pairs) : null, Q = l.quiz ? shuffle(l.quiz) : null;
  const W = shuffle(l.ex), T = shuffle(l.sents), pool = l.sents.map(s => s[0]);
  if (mode === 'lesson') ex.push({ kind: 'learn', l });
  ex.push(earEx(l, 0, P, Q), earEx(l, 1, P, Q));
  ex.push({ kind: 'speak', variant: 'word', l, text: W[0][0], es: W[0][1] });
  ex.push(P ? sayPairEx(l, P[2 % P.length]) : earEx(l, 2, P, Q));

}
const unlockedLessons = () => LESSONS.filter(isUnlocked);
function buildPractice(type, arg) {
  const U = unlockedLessons(), pron = U.filter(l => l.type !== 'dialog');
  if (type === 'sound') return buildLesson(LESSON[arg], 'practice');

    const withP = pron.filter(l => l.pairs); const src = withP.length ? withP : LESSONS.filter(l => l.pairs).slice(0, 1);
    const out = []; for (let i = 0; i < 10; i++) { const l = pick(src); const p = pick(l.pairs); out.push(i % 2 ? sayPairEx(l, p) : { kind: 'pick', l, pair: p, side: Math.random() < .5 ? 0 : 1 }); }
    return out;
  }
  if (type === 'shadow') {
    const all = []; U.forEach(l => { if (l.type === 'dialog') l.lines.forEach(x => all.push({ l, text: x[1], es: x[2] })); else l.sents.forEach(x => all.push({ l, text: x[0], es: x[1] })); });
    return sample(all, 8).map(x => ({ kind: 'shadow', ...x }));
  }
  if (type === 'words') { // palabras con puntaje bajo
    const weak = Object.entries(S.wd).filter(([k, r]) => r.n && r.sum / r.n < 80).sort((a, b) => a[1].sum / a[1].n - b[1].sum / b[1].n).slice(0, 10);
    return weak.map(([k, r]) => ({ kind: 'speak', variant: 'word', l: LESSON[r.sid] || LESSONS[0], text: r.disp || k, es: '' }));
  }
  // 'weak': mezcla de los sonidos más débiles
  const scored = U.map(l => { const a = soundAvg(l.id); const e = S.ear[l.id]; const ea = e && (e.r + e.w) ? e.r / (e.r + e.w) * 100 : null; const vals = [a, ea].filter(v => v !== null); return { l, v: vals.length ? avg(vals) : 101 }; }).sort((a, b) => a.v - b.v);
  const tops = scored.slice(0, 2).map(x => x.l);

}

/* =================== MOTOR DE LECCIÓN =================== */

/* ---- feedback ---- */
const PRAISE = ['¡Excelente!', '¡Muy bien!', '¡Correcto!', '¡Genial!', '¡Así se hace!'];
function feedback(ok, answerHTML, expl, sayText) {

  } else {

    });

async function doMic(btn, onResult) {

  btn.classList.add('rec'); btn.innerHTML = '🔴 Escuchando… habla ahora';
  let recOn = false;
  if (S.settings.recordVoice && Rec.supported) { try { await Rec.start(); recOn = true; } catch (e) {} }
  try { const alts = await recognize(); const url = recOn ? await Rec.stop() : null; onResult(alts, url); }
  catch (err) { if (recOn) await Rec.stop(); toast(SR_ERR[err] || ('Error de voz: ' + err), 3500); }
  finally { btn.classList.remove('rec'); btn.innerHTML = '🎤 Toca para hablar de nuevo'; }
}
let recOnlyActive = false;
async function recOnlyToggle(btn, onDone) {
  if (recOnlyActive) { recOnlyActive = false; const url = await Rec.stop(); btn.classList.remove('rec'); btn.innerHTML = '⏺ Grabar de nuevo'; onDone(url); return; }
  try { await Rec.start(); recOnlyActive = true; btn.classList.add('rec'); btn.innerHTML = '⏹ Detener grabación'; setTimeout(() => { if (recOnlyActive) btn.click(); }, 15000); }
  catch (e) { toast('No se pudo acceder al micrófono: ' + (e.message || e)); }
}
function compareHTML(target, url) { return `<div class="cmp"><button class="btn blue sm" data-cmp="model">🔊 Modelo</button><button class="btn ghost sm" data-cmp="slow">🐢 Lento</button>${url ? `<button class="btn orange sm" data-cmp="me">▶️ Mi voz</button>` : ''}</div>`; }
function bindCompare(target, url, root = document) { $$('[data-cmp]', root).forEach(b => b.onclick = () => { const k = b.dataset.cmp; if (k === 'model') speak(target); else if (k === 'slow') speak(target, true); else Rec.play(url); }); }
function onSpeechResult(ex, target, alts) {
  let r;
  if (ex.kind === 'saypair') { r = scorePair(target, ex.pair[1 - ex.side], alts); r.words = [{ tok: target, s: r.pct / 100, c: colorOf(r.pct / 100) }]; r.alts = alts; r.conf = alts[0].c; }
  else r = scoreSpeech(target, alts);
  if (!ex.attempt || r.pct >= ex.attempt.pct) ex.attempt = r;
  ex.tries = (ex.tries || 0) + 1;
  const url = Rec.url && S.settings.recordVoice ? Rec.url : null;
  $('#tgt').innerHTML = wordsHTML(target, r.words);
  const retry = r.words.filter(w => w.c !== 'g').map(w => w.tok.replace(/[.,!?;:"]/g, ''));
  const pass = ex.kind === 'saypair' ? r.ok : r.pct >= S.settings.threshold;
  $('#res').innerHTML = `<div class="card"><div class="row between"><div><div class="scorebig" style="color:${pass ? 'var(--g-d)' : r.pct >= 50 ? 'var(--o-d)' : 'var(--r)'}">${r.pct}%</div><div class="small muted">Mejor intento: ${ex.attempt.pct}% · intentos: ${ex.tries}</div></div><div class="small" style="text-align:right">🟢 bien · 🟡 dudoso · 🔴 repetir</div></div>
    <div class="heard">Escuché: «<b>${esc(r.heard)}</b>»${r.conf ? ` <span class="muted small">(confianza ${Math.round(r.conf * 100)}%)</span>` : ''}</div>
    ${r.msg ? `<div class="small" style="margin-top:4px">${esc(r.msg)}</div>` : ''}
    ${retry.length && ex.kind !== 'saypair' ? `<div class="small" style="margin-top:8px">Repite: ${retry.map(w => `<span class="wd r" data-say="${esc(w)}">${esc(w)} 🐢</span>`).join(' ')}</div>` : ''}
    ${r.alts.length > 1 ? `<details class="small muted" style="margin-top:6px"><summary>Otras interpretaciones del reconocedor</summary>${r.alts.slice(1).map(a => esc(a.t)).join(' · ')}</details>` : ''}
    ${compareHTML(target, url)}</div>`;
  bindCompare(target, url, $('#res'));
  beep(pass ? 'ok' : 'bad');
  const f = setFoot(`<div class="fb"><h3>${pass ? (r.pct >= 90 ? '🌟 ¡Excelente pronunciación!' : '✅ ¡Bien dicho!') : '🔁 Sigue practicando'}</h3><div class="exp">${pass ? 'Puedes continuar o intentar mejorar tu puntaje.' : 'Escucha el modelo lento, fíjate en las palabras en rojo/amarillo y vuelve a intentarlo. En voz no pierdes vidas.'}</div></div>
    <div class="row"><button class="btn ghost" id="againBtn">Repetir</button><button class="btn primary" id="primaryBtn">Continuar</button></div>`, pass ? 'ok' : 'bad');
  $('#againBtn').onclick = () => $('#mic').click();
  $('#primaryBtn').onclick = () => { const best = ex.attempt; recordSpeech(ex.l.id, best); if (best.words) best.words.forEach(w => { const k = normText(w.tok).join(' '); if (S.wd[k]) S.wd[k].sid = ex.l.id; }); save(); L.speak.push(best.pct); L.done++; nextEx(); };
}

/* ---- fin de lección ---- */
function finishLesson() {
  const secs = Math.round((Date.now() - L.start) / 1000);
  const pron = L.speak.length ? Math.round(avg(L.speak)) : null;
  const ear = L.earN ? Math.round(L.earOk / L.earN * 100) : null;
  let xp = L.mode === 'lesson' ? 10 + (L.mistakes === 0 ? 5 : 0) + (pron !== null && pron >= 85 ? 5 : 0) : 5 + Math.min(5, L.speak.length);
  let extra = '';
  if (L.mode === 'lesson') {
    const first = !S.done[L.l.id];
    const d = S.done[L.l.id] || { times: 0, best: 0 }; d.times++; d.best = Math.max(d.best, pron || 0); d.last = Date.now(); S.done[L.l.id] = d;
    addToDeck(lessonItems(L.l));
    if (first) extra = `<p class="muted">🃏 Se agregaron ${lessonItems(L.l).length} tarjetas a tu mazo de repaso.</p>`;
  } else { refreshHearts(); if (S.hearts < MAX_HEARTS) { S.hearts++; extra = '<p class="muted">❤️ ¡Recuperaste una vida por practicar!</p>'; } }
  S.sessions++;
  const up = addXP(xp); beep('done');
  const goal = S.settings.goal, today = todayRec().xp;
  const retry = {};
  $('#fullInner').innerHTML = `<div class="complete"><div class="mascot" style="width:120px;height:120px">${MASCOT}</div>
    <h1>${L.mode === 'lesson' ? '¡Lección completada!' : '¡Práctica completada!'}</h1><div class="muted">${esc(L.title)}</div>
    <div class="scards">
      <div class="scard" style="border-color:var(--o)"><div class="t" style="background:var(--o)">XP</div><div class="v" style="color:var(--o)">+${xp}</div></div>
      <div class="scard" style="border-color:var(--g)"><div class="t" style="background:var(--g)">Pronunciación</div><div class="v" style="color:var(--g-d)">${pron === null ? '—' : pron + '%'}</div></div>
      <div class="scard" style="border-color:var(--b)"><div class="t" style="background:var(--b)">Oído</div><div class="v" style="color:var(--b-d)">${ear === null ? '—' : ear + '%'}</div></div>
      <div class="scard" style="border-color:#8b5cf6"><div class="t" style="background:#8b5cf6">Tiempo</div><div class="v" style="color:#8b5cf6">${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</div></div>
    </div>
    ${up ? `<p>🔥 ¡Racha de <b>${S.streak}</b> ${S.streak === 1 ? 'día' : 'días'}!</p>` : ''}
    <p>Meta diaria: <b>${Math.min(today, goal)}/${goal} XP</b> ${today >= goal ? '🎉 ¡Cumplida!' : ''}</p>${extra}
    <button class="btn primary" id="primaryBtn" style="min-width:220px;margin-top:10px">Continuar</button></div>`;
  $('#primaryBtn').onclick = closeLesson;
  confetti();
}
function confetti() { const c = document.createElement('div'); c.className = 'confetti'; const cols = ['#1fa463', '#ff9f1c', '#1cb0f6', '#ffd23f', '#e5484d', '#8b5cf6']; for (let i = 0; i < 60; i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = pick(cols); p.style.animationDuration = 1.8 + Math.random() * 2 + 's'; p.style.animationDelay = Math.random() * .6 + 's'; c.appendChild(p); } document.body.appendChild(c); setTimeout(() => c.remove(), 5000); }
function noHeartsModal() {
  modal(`<div style="text-align:center"><div style="font-size:54px">💔</div><h2>Te quedaste sin vidas</h2><p class="muted">Recuperas 1 vida cada 30 minutos (la próxima en ~${nextHeartIn()} min). También puedes ganar una vida completando una práctica.</p></div>
    <div class="row" style="margin-top:14px"><button class="btn ghost block" data-x>Esperar</button><button class="btn blue block" data-p>Practicar</button></div>`,
    (el, close) => { $('[data-x]', el).onclick = close; $('[data-p]', el).onclick = () => { close(); startLesson(null, 'practice', buildPractice('weak'), 'Repaso de sonidos débiles'); }; });
}
document.addEventListener('keydown', e => {
  if (!L || $('#full').classList.contains('hidden')) return;

  else if (/^[1-9]$/.test(e.key)) { const o = $$('#lbody .opt')[+e.key - 1]; if (o && !o.disabled) o.click(); }

</script>
<script>
/* =================== VISTAS =================== */
let TAB = 'learn';
function render() {

  $('#brand').innerHTML = MASCOT + '<span>Tuki Speak</span>';

}
function go(tab) { TAB = tab; stopRecognize(); render(); }
$$('.tab').forEach(t => t.onclick = () => go(t.dataset.tab));
$('#stGear').onclick = () => go('settings');
$('#stHearts').onclick = () => modal(`<h2>❤️ Vidas: ${S.hearts}/${MAX_HEARTS}</h2><p class="muted">Pierdes una vida solo en ejercicios de <b>oído</b> (elegir, ordenar, escribir) durante las lecciones. Los ejercicios de voz nunca quitan vidas. ${S.hearts < MAX_HEARTS ? `Próxima vida en ~${nextHeartIn()} min.` : '¡Estás al máximo!'} Completar una práctica te da +1 vida.</p><button class="btn primary block" data-x>Entendido</button>`, (el, c) => $('[data-x]', el).onclick = c);
$('#stStreak').onclick = () => modal(`<h2>🔥 Racha: ${streakNow()} días</h2><p class="muted">Gana XP cada día para mantener tu racha. Mejor racha: ${S.bestStreak} días. Hoy: ${todayRec().xp}/${S.settings.goal} XP.</p><button class="btn primary block" data-x>¡Vamos!</button>`, (el, c) => $('[data-x]', el).onclick = c);
$('#stXp').onclick = () => go('progress');
const VIEWS = {};

/* ---- Aprender: mapa ---- */
VIEWS.learn = v => {

  const due = dueCards().length;

    ${due ? `<button class="btn blue sm" style="margin-top:8px" id="dueBtn">🃏 Repasar ${due} tarjeta${due > 1 ? 's' : ''}</button>` : ''}</div></div>`;
  if (!HAS_SR) html += `<div class="notice">⚠️ Este navegador no tiene reconocimiento de voz: podrás escuchar, grabarte y comparar, pero no recibir puntaje. Para la experiencia completa usa <b>Google Chrome</b> (Android o computador) o Edge.</div>`;
  COURSE.forEach((u, ui) => {
    const done = u.lessons.filter(l => isDone(l.id)).length;
    html += `<section class="unit"><div class="unit-head" style="background:${u.color}"><div><p>Unidad ${ui + 1} · ${done}/${u.lessons.length}</p><h3>${u.icon} ${esc(u.title)}</h3><p>${esc(u.desc)}</p></div><button class="guide" data-guide="${u.id}">📘 Guía</button></div><div class="path">`;
    u.lessons.forEach((l, li) => {
      const unl = isUnlocked(l), dn = isDone(l.id), isCur = cur && cur.id === l.id;

      html += `<div class="node-wrap" style="transform:translateX(${off}px)">${isCur ? '<div class="start-tip">¡EMPEZAR!</div>' : ''}
        <button class="node ${dn ? 'done' : unl ? '' : 'locked'} ${isCur ? 'current' : ''}" style="--uc:${u.color}" data-lesson="${l.id}" aria-label="${esc(l.title)}">${dn ? '⭐' : unl ? l.icon : '🔒'}</button>
        <div class="node-label">${esc(l.title)}${avgS !== null ? `<br><span class="pill ${avgS >= 80 ? 'ok' : ''}">${avgS}%</span>` : ''}</div></div>`;
    });
    html += `</div></section>`;
  });
  html += `<p class="muted small" style="text-align:center">¿Quieres saltar a otra lección? Activa el "modo libre" en ⚙️ Ajustes.</p>`;

  const db = $('#dueBtn'); if (db) db.onclick = () => startReview();
  $$('[data-lesson]', v).forEach(b => b.onclick = () => lessonSheet(LESSON[b.dataset.lesson]));
  $$('[data-guide]', v).forEach(b => b.onclick = () => guideSheet(COURSE.find(u => u.id === b.dataset.guide)));
};
function lessonSheet(l) {

  modal(`<div class="row"><div style="font-size:40px">${l.icon}</div><div><div class="muted small">${esc(l.unit.title)} · Lección ${l.li + 1}</div><h2 style="margin:0">${esc(l.title)}</h2>${l.type !== 'dialog' ? `<div class="ipa">/${esc(l.sound)}/</div>` : ''}</div></div>
    <div class="tipbox small">${esc(l.type === 'dialog' ? l.scene : l.expl)}</div>
    ${d ? `<p class="small muted">Completada ${d.times} ${d.times === 1 ? 'vez' : 'veces'} · mejor pronunciación ${d.best || '—'}%</p>` : ''}
    ${unl ? `<button class="btn primary block" data-go>${d ? 'Repetir lección' : 'Empezar lección'} (+10 XP)</button>${d ? '<button class="btn ghost block" style="margin-top:10px" data-drill>🎯 Práctica de este sonido</button>' : ''}` : `<div class="notice">🔒 Completa la lección anterior para desbloquear esta (o activa el modo libre en Ajustes).</div>`}`,

}

/* ---- Práctica ---- */
VIEWS.practice = v => {
  const anyDone = Object.keys(S.done).length > 0;
  const weakWords = buildPractice('words').length;
  const cards = [
    ['weak', '🎯', '#ffe8e8', 'Repaso de sonidos débiles', 'Mezcla los sonidos donde tienes menor puntaje. +1 vida.'],
    ['pairs', '👂', '#e3f4ff', 'Pares mínimos rápidos', 'ship/sheep, best/vest… escucha, elige y dilo.'],
    ['shadow', '🪞', '#efe6ff', 'Shadowing', 'Escucha frases a velocidad normal y lenta, imítalas y recibe puntaje.'],
    ['words', '🔁', '#fff3d6', 'Palabras para repetir', weakWords ? `${weakWords} palabras con puntaje bajo.` : 'Aparecerán aquí las palabras que te cuesten.'],
    ['studio', '🎙️', '#e3f8ec', 'Estudio: grabar y comparar', 'Grábate y escúchate junto al modelo nativo. Escribe cualquier frase.'],
    ['chat', '💬', '#e8f0ff', 'Conversación con IA (opcional)', S.settings.geminiKey ? 'Roleplay por voz con tutor que corrige.' : 'Requiere una clave gratuita de Gemini en Ajustes.']

  $$('[data-p]', v).forEach(b => b.onclick = () => {
    const k = b.dataset.p;
    if (k === 'studio') return go('studio');
    if (k === 'chat') return go('chat');
    const q = buildPractice(k);
    if (!q.length) return toast(k === 'words' ? 'Aún no hay palabras débiles. ¡Haz una lección con voz!' : 'Completa una lección primero.');
    startLesson(null, 'practice', q, b.querySelector('h3').textContent);
  });
};

/* ---- Estudio: grabar y comparar ---- */
VIEWS.studio = v => {
  const opts = []; LESSONS.forEach(l => { if (l.type === 'dialog') l.lines.forEach(x => opts.push(x[1])); else { l.ex.forEach(x => opts.push(x[0])); l.sents.forEach(x => opts.push(x[0])); } });
  v.innerHTML = `<button class="btn ghost sm" id="back">← Práctica</button><h2 style="margin-top:12px">🎙️ Estudio: grabar y comparar</h2>
    <p class="muted small">1) Escucha el modelo · 2) Grábate · 3) Compara tu voz con el modelo · 4) Evalúa con el reconocedor (Chrome).</p>
    <div class="card"><label class="small muted" for="stText">Frase o palabra</label><textarea class="inp" id="stText" style="min-height:70px">${esc(pick(opts))}</textarea>
    <div class="row wrap" style="margin-top:8px"><button class="btn ghost sm" id="rnd">🎲 Otra frase</button><select class="field" id="stSel" style="flex:1;min-width:0"><option value="">— Elegir del curso —</option>${opts.map(o => `<option>${esc(o)}</option>`).join('')}</select></div></div>
    <div class="card"><div class="target" id="tgt"></div>
      <div class="cmp"><button class="btn blue sm" id="m1">🔊 Modelo</button><button class="btn ghost sm" id="m2">🐢 Lento</button>
      ${Rec.supported ? `<button class="btn red sm" id="rec">⏺ Grabar</button><button class="btn orange sm" id="me" disabled>▶️ Mi voz</button><button class="btn ghost sm" id="ab" disabled>🔁 Modelo → Mi voz</button>` : '<span class="small muted">Grabación no disponible en este navegador.</span>'}</div>
      ${HAS_SR ? `<button class="mic" id="mic" style="margin-top:14px">🎯 Evaluar pronunciación</button>` : `<div class="notice">Evaluación automática no disponible: usa Chrome.</div>`}
      <div id="res"></div></div>`;
  const txt = () => $('#stText').value.trim() || 'Hello';
  const upd = () => { $('#tgt').innerHTML = wordsHTML(txt()); };

  $('#back').onclick = () => go('practice');

  $('#m1').onclick = () => speak(txt()); $('#m2').onclick = () => speak(txt(), true);
  let myUrl = null;
  const rb = $('#rec'); if (rb) rb.onclick = () => recOnlyToggle(rb, url => { myUrl = url; $('#me').disabled = !url; $('#ab').disabled = !url; rb.innerHTML = '⏺ Grabar de nuevo'; });
  const me = $('#me'); if (me) me.onclick = () => Rec.play(myUrl);
  const ab = $('#ab'); if (ab) ab.onclick = () => speak(txt(), false, () => setTimeout(() => Rec.play(myUrl), 300));
  const mic = $('#mic'); if (mic) mic.onclick = () => doMic(mic, (alts, url) => {

    if (url) { myUrl = url; if (me) { me.disabled = false; ab.disabled = false; } }
    $('#tgt').innerHTML = wordsHTML(txt(), r.words);
    $('#res').innerHTML = `<div class="scorebig" style="margin-top:10px;color:${r.pct >= S.settings.threshold ? 'var(--g-d)' : 'var(--o-d)'}">${r.pct}%</div><div class="heard">Escuché: «<b>${esc(r.heard)}</b>» ${r.conf ? `<span class="small muted">(confianza ${Math.round(r.conf * 100)}%)</span>` : ''}</div>`;

/* ---- Progreso ---- */
VIEWS.progress = v => {
  const all = Object.values(S.snd).flat().sort((a, b) => a.t - b.t);
  const recent = all.slice(-30).map(x => x.s);
  const overall = recent.length ? Math.round(avg(recent)) : null;
  const earT = Object.values(S.ear).reduce((a, e) => ({ r: a.r + e.r, w: a.w + e.w }), { r: 0, w: 0 });

  const rows = LESSONS.map(l => ({ l, a: soundAvg(l.id), n: (S.snd[l.id] || []).length, e: S.ear[l.id] }));
  const withData = rows.filter(r => r.a !== null);
  const weakest = withData.slice().sort((a, b) => a.a - b.a).filter(r => r.a < 90).slice(0, 3);
  const wwords = Object.entries(S.wd).filter(([k, r]) => r.n).map(([k, r]) => ({ k, disp: r.disp || k, a: Math.round(r.sum / r.n), n: r.n })).sort((a, b) => a.a - b.a).slice(0, 10);
  // gráfico de 14 días
  const days = []; for (let i = 13; i >= 0; i--) { const d = new Date(Date.now() - i * DAY); const k = dayKey(d); const r = S.days[k]; days.push({ k, lab: d.getDate(), s: r && r.n ? Math.round(r.sum / r.n) : null, xp: r ? r.xp : 0 }); }
  const W = 320, H = 130, px = i => 18 + i * ((W - 30) / 13), py = s => H - 20 - s / 100 * (H - 36);
  const pts = days.map((d, i) => d.s !== null ? [px(i), py(d.s)] : null).filter(Boolean);

const SCENARIOS = { free: 'a friendly casual chat about the learner\'s day, hobbies and plans', restaurant: 'a waiter at a restaurant in New York; the learner is the customer', airport: 'an airline check-in agent at the airport; the learner is a passenger', interview: 'a job interviewer for a customer service position; the learner is the candidate', shopping: 'a shop assistant in a clothing store; the learner is the customer', doctor: 'a receptionist at a doctor\'s office; the learner wants an appointment' };

let CHAT = { scen: 'free', hist: [], busy: false };
function chatSystem() {
  return `You are "Tuki", a patient, friendly English pronunciation and conversation tutor for a Spanish-speaking learner from Colombia (beginner/intermediate level). Roleplay: you are ${SCENARIOS[CHAT.scen]}.
The learner's messages usually come from browser speech-to-text, so odd words may be mis-recognized pronunciation (e.g. "sheep" for "ship", "tree" for "three", "berry" for "very").
Reply ONLY in this exact format with these three labeled lines:
CORRECCION: <in Spanish, 1-2 short sentences: fix grammar/vocabulary mistakes in the learner's last message and give the corrected English sentence; if it looks like a speech-recognition/pronunciation confusion, say so. Write "¡Perfecto!" if there are no mistakes. For your very first message write "—".>
PRONUNCIACION: <in Spanish: 1-2 words from your reply or the learner's message that Spanish speakers often mispronounce, each with a very short tip, e.g. "think /θ/: saca la lengua entre los dientes". Keep it short.>
REPLY: <your answer in simple, natural English, max 2-3 short sentences, staying in the roleplay and ending with a question to keep the conversation going.>`;
}
async function geminiCall(key, model, contents) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({ systemInstruction: { parts: [{ text: chatSystem() }] }, contents, generationConfig: { temperature: 0.7, maxOutputTokens: 800 } })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const m = (data.error && data.error.message) || res.statusText || 'error'; const e = new Error(res.status + ': ' + m); e.status = res.status; throw e; }
  const text = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || []).map(p => p.text || '').join('').trim();
  if (!text) { const e = new Error('Respuesta vacía del modelo.'); e.status = 0; throw e; }
  return text;
}
async function gemini(userText) {
  const key = S.settings.geminiKey.trim();
  const pref = (S.settings.model || 'gemini-2.5-flash').trim();
  const contents = CHAT.hist.map(m => ({ role: m.role, parts: [{ text: m.text }] }));
  const models = [pref, 'gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-flash-latest', 'gemini-flash-lite-latest'].filter((m, i, a) => m && a.indexOf(m) === i);
  let lastErr;
  for (const model of models) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const out = await geminiCall(key, model, contents);
        if (model !== pref) { S.settings.model = model; save(); }
        return out;
      } catch (e) {
        lastErr = e;
        if (e.status === 400 || e.status === 401 || e.status === 403) throw e; // clave inválida: no sirve reintentar
        if (e.status === 429 || e.status >= 500) await new Promise(r => setTimeout(r, 1200));
        if (!(e.status >= 500) || attempt === 1) break; // 404/429/vacío: pasar al siguiente modelo
      }
    }
  }
  throw lastErr;
}
function parseTutor(t) {
  const get = lab => { const m = t.match(new RegExp(lab + '\\s*:\\s*([\\s\\S]*?)(?=\\n\\s*(CORRECCI[OÓ]N|PRONUNCIACI[OÓ]N|REPLY)\\s*:|$)', 'i')); return m ? m[1].trim() : ''; };
  const reply = get('REPLY');
  return { fix: get('CORRECCI[OÓ]N'), pron: get('PRONUNCIACI[OÓ]N'), reply: reply || t };
}

    <div class="set-row"><div><label for="goal">Meta diaria</label></div><select class="field" id="goal" style="max-width:190px">${[[10, 'Relajada · 10 XP'], [20, 'Normal · 20 XP'], [30, 'Seria · 30 XP'], [50, 'Intensa · 50 XP']].map(g => `<option value="${g[0]}" ${+s.goal === g[0] ? 'selected' : ''}>${g[1]}</option>`).join('')}</select></div>
    <div class="set-row"><div><label for="threshold">Exigencia de pronunciación</label><div class="desc">Puntaje mínimo para aprobar un ejercicio de voz</div></div><select class="field" id="threshold" style="max-width:190px">${[[60, 'Suave · 60%'], [75, 'Normal · 75%'], [85, 'Estricta · 85%']].map(g => `<option value="${g[0]}" ${+s.threshold === g[0] ? 'selected' : ''}>${g[1]}</option>`).join('')}</select></div>
    <div class="set-row"><div><label>Modo libre</label><div class="desc">Desbloquea todas las lecciones</div></div><label class="switch"><input type="checkbox" id="freeMode" ${s.freeMode ? 'checked' : ''}><span></span></label></div>
    <div class="set-row"><div><label>Reconocimiento de voz</label><div class="desc">${HAS_SR ? 'Disponible ✅' : 'No disponible en este navegador ❌ — usa Chrome o Edge'}</div></div><button class="btn ghost sm" id="testMic" ${HAS_SR ? '' : 'disabled'}>Probar 🎤</button></div>
  </div>
  <div class="card"><h3>🤖 Conversación con IA <span class="pill">Opcional</span></h3>
    <p class="small muted">Pega una clave gratuita de Google Gemini (<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">obtener aquí</a>). Se guarda <b>solo en este navegador</b> (localStorage) y se envía únicamente a Google. No la compartas ni la uses en computadores públicos.</p>
    <input class="field" id="gkey" type="password" placeholder="AIza…" value="${esc(s.geminiKey)}" autocomplete="off">
    <div class="row" style="margin-top:8px"><input class="field" id="gmodel" placeholder="gemini-flash-latest" value="${esc(s.model)}" list="gmodels"><datalist id="gmodels"><option value="gemini-flash-latest"><option value="gemini-2.5-flash"><option value="gemini-2.5-flash-lite"></datalist></div>
    <div class="row wrap" style="margin-top:10px"><button class="btn primary sm" id="gsave">Guardar</button><button class="btn ghost sm" id="gdetect">Detectar modelos</button><button class="btn ghost sm" id="gdel">Borrar clave</button></div><div id="gmsg" class="small" style="margin-top:8px"></div>
  </div>
  <div class="card"><h3>Datos</h3>
    <div class="row wrap"><button class="btn ghost sm" id="exp">⬇️ Exportar progreso</button><label class="btn ghost sm" style="margin:0">⬆️ Importar<input type="file" id="imp" accept="application/json" hidden></label></div>
    <button class="btn red block" id="reset" style="margin-top:14px">Borrar todo mi progreso</button>
  </div>
  <p class="muted small" style="text-align:center">Tuki Speak · 100% gratis y sin servidor · tus datos quedan en este dispositivo.</p>`;
  const set = (k, val) => { S.settings[k] = val; save(); };
  $('#rate').oninput = e => { set('rate', +e.target.value); $('#rateV').textContent = (+e.target.value).toFixed(2) + '×'; };
  $('#tRate').onclick = () => speak('Hello! This is how fast I speak. Think, three, very, ship, sheep.');
  $('#voice').onchange = e => { set('voice', e.target.value); speak('Hello, how are you?'); };
  ['autoplay', 'sound', 'recordVoice', 'freeMode'].forEach(k => $('#' + k).onchange = e => set(k, e.target.checked));
  $('#goal').onchange = e => set('goal', +e.target.value);
  $('#threshold').onchange = e => set('threshold', +e.target.value);
  $('#testMic').onclick = () => doMic($('#testMic'), alts => { toast('Escuché: «' + alts[0].t + '» (' + Math.round((alts[0].c || 0) * 100) + '%)', 4000); $('#testMic').innerHTML = 'Probar 🎤'; });
  const gmsg = $('#gmsg');
  $('#gsave').onclick = () => { set('geminiKey', $('#gkey').value.trim()); set('model', $('#gmodel').value.trim() || 'gemini-flash-latest'); CHAT.hist = []; gmsg.textContent = S.settings.geminiKey ? '✅ Guardado. Ve a la pestaña IA.' : 'Clave vacía: la IA queda desactivada.'; };
  $('#gdel').onclick = () => { set('geminiKey', ''); $('#gkey').value = ''; gmsg.textContent = 'Clave borrada.'; };
  $('#gdetect').onclick = async () => {
    const key = $('#gkey').value.trim(); if (!key) { gmsg.textContent = 'Primero pega tu clave.'; return; }
    gmsg.textContent = 'Consultando modelos…';
    try {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(key)); const d = await r.json();
      if (!r.ok) throw new Error((d.error && d.error.message) || r.status);
      const ms = (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace('models/', '')).filter(n => /flash/.test(n) && !/image|tts|audio|live|embedding/.test(n));
      $('#gmodels').innerHTML = ms.map(m => `<option value="${esc(m)}">`).join('');
      gmsg.innerHTML = ms.length ? '✅ Clave válida. Modelos disponibles: ' + ms.slice(0, 12).map(esc).join(', ') + '. Escribe o elige uno arriba y guarda.' : 'Clave válida, pero no se encontraron modelos "flash".';
    } catch (e) { gmsg.textContent = '❌ ' + e.message; }
  };
  $('#exp').onclick = () => { const a = document.createElement('a'); const s2 = { ...S, settings: { ...S.settings, geminiKey: '' } }; a.href = URL.createObjectURL(new Blob([JSON.stringify(s2, null, 1)], { type: 'application/json' })); a.download = 'tuki-speak-progreso-' + dayKey() + '.json'; a.click(); };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { const d = JSON.parse(t); if (!d || d.v !== 1) throw new Error('Archivo no válido'); const key = S.settings.geminiKey; S = d; S.settings = { ...DEFAULT_SETTINGS, ...d.settings, geminiKey: key }; save(); load(); toast('Progreso importado ✅'); render(); }).catch(err => toast('Error: ' + err.message)); };
  $('#reset').onclick = () => confirmBox('¿Borrar todo tu progreso?', 'Se eliminarán XP, racha, lecciones, puntajes y tarjetas. Tus ajustes (y la clave de IA) se conservan. Esta acción no se puede deshacer.', 'Sí, borrar todo', () => { const keep = S.settings; S = freshState(); S.settings = keep; save(); CHAT.hist = []; toast('Progreso borrado.'); go('learn'); }, true);
};

/* =================== INICIO =================== */
save(); render();
setInterval(() => { const h = S.hearts; refreshHearts(); if (h !== S.hearts && !L) render(); }, 60e3);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
// Gancho de pruebas (solo lectura del estado interno)
window.TUKI = { get S() { return S; }, get L() { return L; }, get R() { return R; }, LESSONS, scoreSpeech, scorePair, typedMatch, normText, onSpeechResult, go, startLesson, buildPractice };
</script>
</body>
</html>
